name: Release

on:
  push:
    tags: ['v**']

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soundwave_app
    steps:
      - uses: actions/checkout@v7

      - name: Check for Flutter project
        id: check
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "::notice::No pubspec.yaml found. Skipping Flutter build."
            echo "has_pubspec=false" >> $GITHUB_OUTPUT
          else
            echo "has_pubspec=true" >> $GITHUB_OUTPUT
          fi

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.has_pubspec == 'true'
        with:
          flutter-version: '3.47.x'
          cache: true

      - uses: actions/setup-java@v6
        if: steps.check.outputs.has_pubspec == 'true'
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK
        if: steps.check.outputs.has_pubspec == 'true'
        run: flutter build apk --release

      - name: Build AAB
        if: steps.check.outputs.has_pubspec == 'true'
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.has_pubspec == 'true'
        with:
          name: android-release
          path: |
            soundwave_app/build/app/outputs/flutter-apk/app-release.apk
            soundwave_app/build/app/outputs/bundle/release/app-release.aab

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: soundwave_app
    steps:
      - uses: actions/checkout@v7

      - name: Check for Flutter project
        id: check
        shell: bash
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "::notice::No pubspec.yaml found. Skipping Flutter build."
            echo "has_pubspec=false" >> $GITHUB_OUTPUT
          else
            echo "has_pubspec=true" >> $GITHUB_OUTPUT
          fi

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.has_pubspec == 'true'
        with:
          flutter-version: '3.47.x'
          cache: true

      - name: Build Windows
        if: steps.check.outputs.has_pubspec == 'true'
        run: flutter build windows --release

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.has_pubspec == 'true'
        with:
          name: windows-release
          path: soundwave_app/build/windows/x64/runner/Release/

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: soundwave_app
    steps:
      - uses: actions/checkout@v7

      - name: Check for Flutter project
        id: check
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "::notice::No pubspec.yaml found. Skipping Flutter build."
            echo "has_pubspec=false" >> $GITHUB_OUTPUT
          else
            echo "has_pubspec=true" >> $GITHUB_OUTPUT
          fi

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.has_pubspec == 'true'
        with:
          flutter-version: '3.47.x'
          cache: true

      - name: Build macOS
        if: steps.check.outputs.has_pubspec == 'true'
        run: flutter build macos --release

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.has_pubspec == 'true'
        with:
          name: macos-release
          path: soundwave_app/build/macos/Build/Products/Release/

  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soundwave_app
    steps:
      - uses: actions/checkout@v7

      - name: Check for Flutter project
        id: check
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "::notice::No pubspec.yaml found. Skipping Flutter build."
            echo "has_pubspec=false" >> $GITHUB_OUTPUT
          else
            echo "has_pubspec=true" >> $GITHUB_OUTPUT
          fi

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.has_pubspec == 'true'
        with:
          flutter-version: '3.47.x'
          cache: true

      - name: Install Linux dependencies
        if: steps.check.outputs.has_pubspec == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Build Linux
        if: steps.check.outputs.has_pubspec == 'true'
        run: flutter build linux --release

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.has_pubspec == 'true'
        with:
          name: linux-release
          path: soundwave_app/build/linux/x64/release/bundle/

  deploy-android:
    runs-on: ubuntu-latest
    needs: [build-android]
    if: always() && needs.build-android.result == 'success'
    # The `secrets` context is not allowed in step-level `if:` expressions
    # (GitHub rejects the whole workflow file). Expose presence flags via env.
    env:
      HAS_PLAY_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-release

      - name: Skip notice (no Play Store credentials)
        if: env.HAS_PLAY_ACCOUNT != 'true'
        run: echo "::notice::GOOGLE_PLAY_SERVICE_ACCOUNT not configured; skipping Play Store upload."

      - name: Deploy to Play Store
        if: env.HAS_PLAY_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: com.pxalabs.soundwave
          releaseFiles: app-release.aab
          track: internal
          status: completed

  deploy-github-release:
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-macos, build-linux]
    # Publish only when every platform build succeeded, so a release never
    # silently ships with missing platform assets.
    if: >-
      always() &&
      needs.build-android.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-macos.result == 'success' &&
      needs.build-linux.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            android-release/*
            windows-release/*
            macos-release/*
            linux-release/*
          draft: true
          generate_release_notes: true

  deploy-snap:
    runs-on: ubuntu-latest
    needs: [build-linux]
    if: always() && needs.build-linux.result == 'success'
    env:
      HAS_SNAP_TOKEN: ${{ secrets.SNAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for snapcraft.yaml
        id: snap
        run: |
          if [ -f snap/snapcraft.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::snap/snapcraft.yaml not found; skipping Snap build (tracked in #95)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        if: steps.snap.outputs.present == 'true'
        with:
          name: linux-release
          path: snap/gui/

      - uses: snapcore/action-build@v1
        if: steps.snap.outputs.present == 'true'
        id: snapcraft

      - uses: snapcore/action-publish@v1
        if: steps.snap.outputs.present == 'true' && env.HAS_SNAP_TOKEN == 'true'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAP_TOKEN }}
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: stable
