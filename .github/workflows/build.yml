name: Build

on:
  push:
    branches: [main]
    tags: ['v**']
  # Also build on PRs that touch the app or this workflow, so platform
  # breakage is caught before it lands on main.
  pull_request:
    paths:
      - 'soundwave_app/**'
      - '.github/workflows/build.yml'
      - '.github/scripts/android_signing.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    # Issues #87/#94: builds libsoundwave.so for arm64-v8a, armeabi-v7a and
    # x86_64 via Gradle externalNativeBuild, then debug APK, per-ABI release
    # APKs and an AAB. Release signing uses the ANDROID_KEYSTORE_* secrets
    # when present, otherwise release builds are debug-signed.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: soundwave_app
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      BUNDLETOOL_VERSION: '1.18.3'
      BUNDLETOOL_SHA256: 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29'
    steps:
      - uses: actions/checkout@v7

      - name: Check for Flutter project
        id: check
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "::notice::No pubspec.yaml found. Skipping Flutter build."
            echo "has_pubspec=false" >> $GITHUB_OUTPUT
          else
            echo "has_pubspec=true" >> $GITHUB_OUTPUT
          fi

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.has_pubspec == 'true'
        with:
          flutter-version: '3.47.x'
          cache: true

      - uses: actions/setup-java@v6
        if: steps.check.outputs.has_pubspec == 'true'
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Configure release signing
        if: steps.check.outputs.has_pubspec == 'true' && env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ../.github/scripts/android_signing.sh configure .

      - name: Signing mode
        if: steps.check.outputs.has_pubspec == 'true' && env.HAS_KEYSTORE != 'true'
        run: echo "::notice::ANDROID_KEYSTORE_BASE64 not set; release APK/AAB are debug-signed (not for Play Store upload)."

      - name: Build debug APK
        if: steps.check.outputs.has_pubspec == 'true'
        run: flutter build apk --debug

      - name: Build release APKs (split per ABI)
        if: steps.check.outputs.has_pubspec == 'true'
        run: flutter build apk --release --split-per-abi

      - name: Build AAB
        if: steps.check.outputs.has_pubspec == 'true'
        run: flutter build appbundle --release

      - name: Verify libsoundwave.so is packaged
        if: steps.check.outputs.has_pubspec == 'true'
        run: |
          set -euo pipefail
          apk_dir=build/app/outputs/flutter-apk
          aab=build/app/outputs/bundle/release/app-release.aab
          abis="arm64-v8a armeabi-v7a x86_64"
          fail=0
          require() { # archive entry
            if unzip -l "$1" | grep -E " $2\$" > /dev/null; then
              echo "ok   $1 -> $2"
            else
              echo "::error::$2 missing from $1"
              unzip -l "$1" | grep '\.so$' || true
              fail=1
            fi
          }
          for abi in $abis; do
            require "$apk_dir/app-debug.apk" "lib/$abi/libsoundwave.so"
            require "$apk_dir/app-$abi-release.apk" "lib/$abi/libsoundwave.so"
            require "$aab" "base/lib/$abi/libsoundwave.so"
          done
          [ "$fail" = 0 ] || exit 1

          # Exported FFI symbols and 16 KB ELF alignment (Play requirement).
          tmp=$(mktemp -d)
          for abi in $abis; do
            unzip -p "$apk_dir/app-$abi-release.apk" "lib/$abi/libsoundwave.so" > "$tmp/$abi.so"
            readelf -h "$tmp/$abi.so" | grep -E 'Class|Machine'
            for sym in sw_version sw_audio_capture_start sw_audio_playback_start sw_css_modulate; do
              if ! readelf --dyn-syms -W "$tmp/$abi.so" | grep -w "$sym" > /dev/null; then
                echo "::error::$abi libsoundwave.so does not export $sym"; exit 1
              fi
            done
            if [ "$abi" != "armeabi-v7a" ]; then
              if ! readelf -lW "$tmp/$abi.so" | awk '$1=="LOAD" && $NF!="0x4000" { bad=1 } END { exit bad }'; then
                echo "::error::$abi libsoundwave.so LOAD segments are not 16 KB aligned"
                readelf -lW "$tmp/$abi.so"; exit 1
              fi
            fi
          done
          ls -l "$apk_dir" "$(dirname "$aab")"

      - name: Remove signing material
        if: always() && steps.check.outputs.has_pubspec == 'true'
        run: ../.github/scripts/android_signing.sh cleanup .

      - name: Fetch bundletool
        if: steps.check.outputs.has_pubspec == 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          echo "${BUNDLETOOL_SHA256}  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -

      # Same checks as release.yml (apksigner, jarsigner, one certificate
      # across all artifacts, bundletool validate), without requiring a
      # release key so PRs and forks still build.
      - name: Verify signatures and bundle
        if: steps.check.outputs.has_pubspec == 'true'
        run: |
          ../.github/scripts/android_signing.sh verify \
            --apk-dir build/app/outputs/flutter-apk \
            --aab build/app/outputs/bundle/release/app-release.aab \
            --bundletool "$RUNNER_TEMP/bundletool.jar"

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.has_pubspec == 'true'
        with:
          name: android-debug-apk
          path: soundwave_app/build/app/outputs/flutter-apk/app-debug.apk

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.has_pubspec == 'true'
        with:
          name: android-release-apks
          path: soundwave_app/build/app/outputs/flutter-apk/app-*-release.apk

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.has_pubspec == 'true'
        with:
          name: android-release-aab
          path: soundwave_app/build/app/outputs/bundle/release/app-release.aab

  # Desktop jobs (issue #95): build the app with libsoundwave bundled, assert
  # the native library is present and loadable, then package. Packages here
  # are unsigned; signing happens in release.yml (#35).
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: soundwave_app
    steps:
      - uses: actions/checkout@v7

      - name: Check for Flutter project
        id: check
        shell: bash
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "::notice::No pubspec.yaml found. Skipping Flutter build."
            echo "has_pubspec=false" >> $GITHUB_OUTPUT
          else
            echo "has_pubspec=true" >> $GITHUB_OUTPUT
          fi

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.has_pubspec == 'true'
        with:
          flutter-version: '3.47.x'
          cache: true

      - name: Build Windows
        if: steps.check.outputs.has_pubspec == 'true'
        run: flutter build windows --release

      - name: Verify bundled native library
        if: steps.check.outputs.has_pubspec == 'true'
        shell: pwsh
        run: |
          $rel = 'build\windows\x64\runner\Release'
          Get-ChildItem -Recurse $rel | Select-Object FullName, Length | Format-Table -AutoSize
          $dll = Join-Path $rel 'soundwave.dll'
          if (-not (Test-Path $dll)) { throw "soundwave.dll not bundled next to soundwave.exe" }
          python -c "import ctypes,sys; l=ctypes.CDLL(sys.argv[1]); l.sw_crc32; l.sw_version.restype=ctypes.c_char_p; print('loaded', sys.argv[1], l.sw_version().decode())" (Resolve-Path $dll).Path

      - name: Package (zip + MSIX, unsigned)
        if: steps.check.outputs.has_pubspec == 'true'
        shell: pwsh
        run: |
          $version = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value -split '\+')[0]
          ./windows/packaging/package.ps1 -ReleaseDir build\windows\x64\runner\Release -Version $version -OutDir dist

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.has_pubspec == 'true'
        with:
          name: windows-release
          path: soundwave_app/dist/

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: soundwave_app
    steps:
      - uses: actions/checkout@v7

      - name: Check for Flutter project
        id: check
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "::notice::No pubspec.yaml found. Skipping Flutter build."
            echo "has_pubspec=false" >> $GITHUB_OUTPUT
          else
            echo "has_pubspec=true" >> $GITHUB_OUTPUT
          fi

      # Flutter 3.47.8/3.47.9 gen_snapshot aborts on macOS ('Class with illegal
      # cid' on _Rect in widgets/_window_macos.dart) for some app code, e.g.
      # the mic permission gate (#87). 3.50.0 builds it. Unify all jobs on
      # 3.50.0 once android/ uses AGP >= 9.1.1 (required by 3.50).
      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.has_pubspec == 'true'
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Build macOS
        if: steps.check.outputs.has_pubspec == 'true'
        run: flutter build macos --release

      - name: Embed libsoundwave.dylib
        if: steps.check.outputs.has_pubspec == 'true'
        run: bash macos/packaging/embed_native.sh build/macos/Build/Products/Release/soundwave.app

      - name: Package DMG (ad-hoc signed)
        if: steps.check.outputs.has_pubspec == 'true'
        run: |
          version="$(sed -n 's/^version:[[:space:]]*\([^+]*\).*/\1/p' pubspec.yaml)"
          mkdir -p dist
          bash macos/packaging/sign_and_package.sh build/macos/Build/Products/Release/soundwave.app \
            "dist/soundwave-${version}-macos-universal.dmg"

      - name: Verify bundled native library
        if: steps.check.outputs.has_pubspec == 'true'
        run: |
          app=build/macos/Build/Products/Release/soundwave.app
          ls -la "$app/Contents/MacOS" "$app/Contents/Frameworks"
          lib="$app/Contents/Frameworks/libsoundwave.dylib"
          test -f "$lib" || { echo "::error::libsoundwave.dylib not in Frameworks"; exit 1; }
          lipo "$lib" -verify_arch arm64 x86_64
          otool -l "$app/Contents/MacOS/soundwave" | grep -A2 LC_RPATH | grep -q '@executable_path/../Frameworks' \
            || { echo "::error::Runner rpath lacks @executable_path/../Frameworks"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist"
          python3 -c "import ctypes,sys; l=ctypes.CDLL(sys.argv[1]); l.sw_crc32; l.sw_version.restype=ctypes.c_char_p; print('loaded', sys.argv[1], l.sw_version().decode())" "$lib"

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.has_pubspec == 'true'
        with:
          name: macos-release
          path: soundwave_app/dist/

  build-linux:
    # 22.04 (glibc 2.35) so the AppImage/.deb also run on older distros.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: soundwave_app
    steps:
      - uses: actions/checkout@v7

      - name: Check for Flutter project
        id: check
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "::notice::No pubspec.yaml found. Skipping Flutter build."
            echo "has_pubspec=false" >> $GITHUB_OUTPUT
          else
            echo "has_pubspec=true" >> $GITHUB_OUTPUT
          fi

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.has_pubspec == 'true'
        with:
          flutter-version: '3.47.x'
          cache: true

      - name: Install Linux dependencies
        if: steps.check.outputs.has_pubspec == 'true'
        run: |
          sudo apt-get update
          # ubuntu-22.04 ships libunwind-14-dev, which conflicts with the
          # libunwind-dev that libgstreamer1.0-dev depends on.
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Build Linux
        if: steps.check.outputs.has_pubspec == 'true'
        run: flutter build linux --release

      - name: Verify bundled native library
        if: steps.check.outputs.has_pubspec == 'true'
        run: |
          bundle=build/linux/x64/release/bundle
          find "$bundle" -maxdepth 2 -type f -exec ls -la {} + | grep -v flutter_assets
          lib="$bundle/lib/libsoundwave.so"
          test -f "$lib" || { echo "::error::libsoundwave.so not in bundle/lib"; exit 1; }
          nm -D --defined-only "$lib" | grep -c ' T sw_'
          python3 -c "import ctypes,sys; l=ctypes.CDLL(sys.argv[1]); l.sw_crc32; l.sw_version.restype=ctypes.c_char_p; print('loaded', sys.argv[1], l.sw_version().decode())" "$lib"

      - name: Package (tar.gz + deb + AppImage)
        if: steps.check.outputs.has_pubspec == 'true'
        run: |
          version="$(sed -n 's/^version:[[:space:]]*\([^+]*\).*/\1/p' pubspec.yaml)"
          bash linux/packaging/package.sh build/linux/x64/release/bundle "$version" dist

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.has_pubspec == 'true'
        with:
          name: linux-release
          path: soundwave_app/dist/
