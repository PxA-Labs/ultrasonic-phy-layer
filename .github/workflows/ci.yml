name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  flutter-quality-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soundwave_app
    steps:
      - uses: actions/checkout@v7

      - name: Check for Flutter project
        id: check
        run: echo "exists=$([ -f pubspec.yaml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.exists == 'true'
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: flutter pub get

      - name: Analyze Dart code
        if: steps.check.outputs.exists == 'true'
        run: flutter analyze --fatal-infos

      - name: Check formatting
        if: steps.check.outputs.exists == 'true'
        run: dart format --set-exit-if-changed .

      - name: Build native library for FFI tests
        if: steps.check.outputs.exists == 'true'
        working-directory: native
        run: |
          cmake -S . -B build-ffi -DCMAKE_BUILD_TYPE=Release -DSW_BUILD_TESTS=OFF
          cmake --build build-ffi --target soundwave_shared -j "$(nproc)"

      - name: Run Flutter tests
        if: steps.check.outputs.exists == 'true'
        env:
          # Run the real-DSP loopback tests against this commit's native code;
          # fail (instead of skipping) if the library cannot be loaded.
          SOUNDWAVE_LIB: ${{ github.workspace }}/native/build-ffi/libsoundwave.so
          SOUNDWAVE_REQUIRE_NATIVE: '1'
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && steps.check.outputs.exists == 'true'
        uses: codecov/codecov-action@v7
        with:
          files: soundwave_app/coverage/lcov.info

  dsp-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for native CMakeLists
        id: check
        run: echo "exists=$([ -f native/CMakeLists.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Install Linux dependencies
        if: steps.check.outputs.exists == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ make ccache
        shell: bash

      - name: Install macOS dependencies
        if: steps.check.outputs.exists == 'true' && matrix.os == 'macos-latest'
        run: |
          brew install ccache
        shell: bash

      - name: Install Windows dependencies
        if: steps.check.outputs.exists == 'true' && matrix.os == 'windows-latest'
        run: choco install ccache --no-progress
        shell: pwsh

      - name: Setup ccache
        if: steps.check.outputs.exists == 'true'
        run: |
          ccache --max-size=200M
          ccache --zero-stats
        shell: bash

      - name: Cache ccache
        if: steps.check.outputs.exists == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.os }}-dsp-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os }}-dsp-

      - name: Configure CMake
        if: steps.check.outputs.exists == 'true'
        run: |
          cd native
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.os == 'ubuntu-latest' && '-DSW_BUILD_COVERAGE=ON' || '' }}
        shell: bash

      - name: Build DSP core
        if: steps.check.outputs.exists == 'true'
        run: cmake --build native/build --config Release
        shell: bash

      - name: Run DSP core tests
        if: steps.check.outputs.exists == 'true'
        run: |
          cd native/build
          ctest --output-on-failure --build-config Release
        shell: bash

      - name: Show ccache stats
        if: steps.check.outputs.exists == 'true'
        run: ccache --show-stats
        shell: bash

  dsp-coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ make lcov

      - name: Configure with coverage
        run: |
          cd native
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DSW_BUILD_COVERAGE=ON

      - name: Build and run tests
        run: |
          cd native
          cmake --build build
          cd build
          ctest --output-on-failure

      - name: Generate coverage report
        run: |
          cd native/build
          find . -name "*.gcda" 2>/dev/null
          lcov --capture --directory . --output-file coverage.info \
            --ignore-errors empty,unused 2>&1 || true
          if [ -s coverage.info ]; then
            lcov --remove coverage.info '/usr/*' '*/_deps/*' \
              -o coverage_filtered.info --ignore-errors empty,unused 2>&1 || true
            # Check if filtered file has any records
            if [ -s coverage_filtered.info ] && grep -q "^SF:" coverage_filtered.info; then
              lcov --list coverage_filtered.info
            else
              echo "All records removed by filters. Using full coverage data."
              cp coverage.info coverage_filtered.info
            fi
          else
            echo "No coverage data generated."
          fi

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: native/build/coverage_filtered.info
          flags: dsp-core
          fail_ci_if_error: false
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Memory safety (issue #28)
  # ---------------------------------------------------------------------------
  dsp-sanitizers:
    name: dsp-sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan]
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build

      - name: Configure (${{ matrix.sanitizer }})
        run: |
          cmake -S native -B native/build-${{ matrix.sanitizer }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DSW_ENABLE_ASAN=${{ matrix.sanitizer == 'asan' && 'ON' || 'OFF' }} \
            -DSW_ENABLE_UBSAN=${{ matrix.sanitizer == 'ubsan' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build native/build-${{ matrix.sanitizer }}

      - name: Run all tests, sanitizer canaries and fuzz smoke tests
        run: ctest --test-dir native/build-${{ matrix.sanitizer }} --output-on-failure -j "$(nproc)"

  dsp-fuzz:
    name: dsp-fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_crc, fuzz_rs, fuzz_css, fuzz_ofdm, fuzz_packet, fuzz_fec, fuzz_api]
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm cmake ninja-build
          sudo apt-get install -y libclang-rt-dev || true
          echo 'int LLVMFuzzerTestOneInput(const char*d,unsigned long n){return 0;}' > probe.c
          clang -fsanitize=fuzzer probe.c -o probe && echo "libFuzzer available"

      - name: Configure libFuzzer + ASan + UBSan build
        run: |
          cmake -S native -B native/build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DSW_BUILD_TESTS=OFF \
            -DSW_ENABLE_FUZZER=ON -DSW_ENABLE_ASAN=ON -DSW_ENABLE_UBSAN=ON

      - name: Build ${{ matrix.target }}
        run: cmake --build native/build-fuzz --target ${{ matrix.target }}

      - name: Fuzz ${{ matrix.target }} for 60 s
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/native/Fuzzing/lsan.supp
        run: |
          mkdir -p corpus artifacts
          ./native/build-fuzz/Fuzzing/${{ matrix.target }} corpus \
            -max_total_time=60 -max_len=16384 -rss_limit_mb=2048 -timeout=25 \
            -print_final_stats=1 -artifact_prefix=artifacts/

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: ignore

  dsp-static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install analyzers
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang clang-tidy cmake ninja-build

      - name: cppcheck
        run: |
          cppcheck --version
          cppcheck --enable=warning,portability --std=c11 --inline-suppr \
            --suppressions-list=native/.cppcheck-suppressions \
            --error-exitcode=1 --quiet \
            -I native/include native/src native/Fuzzing native/tests/test_memsafety.c

      - name: clang-tidy
        run: |
          cmake -S native -B native/build-tidy -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DSW_BUILD_TESTS=OFF
          clang-tidy --version
          find native/src -name '*.c' -print0 | \
            xargs -0 -n1 -P "$(nproc)" clang-tidy -p native/build-tidy --quiet

  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate headings
        run: |
          for file in docs/*.md README.md; do
            if [ -f "$file" ]; then
              echo "Validating: $file"
              head -1 "$file" | grep -q "^#" || echo "WARNING: $file may be missing heading"
            fi
          done

      - name: Check markdown files exist
        run: |
          find . -name "*.md" -not -path "./.git/*" -not -path "./_deps/*" | while read f; do
            echo "Found: $f"
          done
