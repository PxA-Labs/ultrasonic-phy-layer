name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # Coverage gates (issue #36): CI fails if coverage drops below these.
  # Set just below the measured numbers; raise them as coverage improves.
  NATIVE_MIN_LINE: '0'
  NATIVE_MIN_BRANCH: '0'
  FLUTTER_MIN_LINE: '0'

jobs:
  flutter-quality-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soundwave_app
    steps:
      - uses: actions/checkout@v7

      - name: Check for Flutter project
        id: check
        run: echo "exists=$([ -f pubspec.yaml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.exists == 'true'
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: flutter pub get

      - name: Analyze Dart code
        if: steps.check.outputs.exists == 'true'
        run: flutter analyze --fatal-infos

      - name: Check formatting
        if: steps.check.outputs.exists == 'true'
        # On failure, print the exact diff so it can be fixed without a local SDK.
        run: |
          if ! dart format --set-exit-if-changed . ; then
            dart format . > /dev/null
            git --no-pager diff -- '*.dart'
            exit 1
          fi

      - name: Build native library for FFI tests
        if: steps.check.outputs.exists == 'true'
        working-directory: native
        run: |
          cmake -S . -B build-ffi -DCMAKE_BUILD_TYPE=Release -DSW_BUILD_TESTS=OFF
          cmake --build build-ffi --target soundwave_shared -j "$(nproc)"

      - name: Run Flutter tests
        if: steps.check.outputs.exists == 'true'
        env:
          # Run the real-DSP loopback tests against this commit's native code;
          # fail (instead of skipping) if the library cannot be loaded.
          SOUNDWAVE_LIB: ${{ github.workspace }}/native/build-ffi/libsoundwave.so
          SOUNDWAVE_REQUIRE_NATIVE: '1'
        run: |
          mkdir -p build
          flutter test --coverage --file-reporter json:build/flutter-test-results.json

      - name: Flutter coverage gate
        if: steps.check.outputs.exists == 'true'
        run: |
          python3 ../.github/scripts/coverage_report.py report \
            --name "Flutter app" --lcov coverage/lcov.info --include '(^|/)lib/' --worst 40 --uncovered 25 \
            --min-line "$FLUTTER_MIN_LINE" \
            --flutter-json build/flutter-test-results.json \
            --json-out coverage/summary-flutter.json

      - name: Upload Flutter coverage artifact
        if: always() && steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-flutter
          path: |
            soundwave_app/coverage/lcov.info
            soundwave_app/coverage/summary-flutter.json
            soundwave_app/build/flutter-test-results.json
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        # Optional: without a CODECOV_TOKEN the upload may be rejected; that
        # must never fail CI (the gate above is the source of truth).
        if: github.event_name == 'push' && steps.check.outputs.exists == 'true'
        uses: codecov/codecov-action@v7
        with:
          files: soundwave_app/coverage/lcov.info
          flags: flutter
          fail_ci_if_error: false
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Flutter integration tests (issue #34): the real Linux desktop app (with the
  # bundled native DSP library) under a virtual X server.
  # ---------------------------------------------------------------------------
  flutter-integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: soundwave_app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          # ubuntu-22.04 ships libunwind-14-dev, which conflicts with the
          # libunwind-dev that libgstreamer1.0-dev depends on.
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev xvfb

      - name: Install dependencies
        run: |
          flutter pub get
          git --no-pager diff -- pubspec.lock

      - name: Run integration tests (Linux desktop, xvfb)
        run: |
          mkdir -p build
          xvfb-run -a flutter test integration_test -d linux \
            --file-reporter json:build/integration-test-results.json

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: soundwave_app/build/integration-test-results.json
          if-no-files-found: ignore

  dsp-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for native CMakeLists
        id: check
        run: echo "exists=$([ -f native/CMakeLists.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Install Linux dependencies
        if: steps.check.outputs.exists == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ make ccache
        shell: bash

      - name: Install macOS dependencies
        if: steps.check.outputs.exists == 'true' && matrix.os == 'macos-latest'
        run: |
          brew install ccache
        shell: bash

      - name: Install Windows dependencies
        if: steps.check.outputs.exists == 'true' && matrix.os == 'windows-latest'
        run: choco install ccache --no-progress
        shell: pwsh

      - name: Setup ccache
        if: steps.check.outputs.exists == 'true'
        run: |
          ccache --max-size=200M
          ccache --zero-stats
        shell: bash

      - name: Cache ccache
        if: steps.check.outputs.exists == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.os }}-dsp-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os }}-dsp-

      - name: Configure CMake
        if: steps.check.outputs.exists == 'true'
        run: |
          cd native
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.os == 'ubuntu-latest' && '-DSW_BUILD_COVERAGE=ON' || '' }}
        shell: bash

      - name: Build DSP core
        if: steps.check.outputs.exists == 'true'
        run: cmake --build native/build --config Release
        shell: bash

      - name: Run DSP core tests
        if: steps.check.outputs.exists == 'true'
        run: |
          cd native/build
          ctest --output-on-failure --build-config Release
        shell: bash

      - name: Show ccache stats
        if: steps.check.outputs.exists == 'true'
        run: ccache --show-stats
        shell: bash

  dsp-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ make
          pipx install gcovr
          gcovr --version

      - name: Configure with coverage
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Debug -DSW_BUILD_COVERAGE=ON

      - name: Build
        run: cmake --build native/build -j "$(nproc)"

      - name: Run tests
        # Serial on purpose: concurrent processes update the same .gcda files.
        run: ctest --test-dir native/build --output-on-failure --output-junit ctest-results.xml

      - name: Generate coverage report
        working-directory: native
        run: |
          mkdir -p build/coverage-html
          gcovr --root . --filter 'src/' \
            --exclude-unreachable-branches --exclude-throw-branches \
            --lcov build/coverage.lcov \
            --html-details build/coverage-html/index.html \
            --print-summary build

      - name: Native coverage gate
        run: |
          python3 .github/scripts/coverage_report.py report \
            --name "Native DSP core" --lcov native/build/coverage.lcov \
            --include '(^|/)src/' --worst 40 --uncovered 25 \
            --min-line "$NATIVE_MIN_LINE" --min-branch "$NATIVE_MIN_BRANCH" \
            --junit native/build/ctest-results.xml \
            --json-out native/build/summary-native.json

      - name: Upload native coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-native
          path: |
            native/build/coverage.lcov
            native/build/summary-native.json
            native/build/ctest-results.xml
            native/build/coverage-html/
          if-no-files-found: warn

      - name: Upload to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v7
        with:
          files: native/build/coverage.lcov
          flags: dsp-core
          fail_ci_if_error: false
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Quality dashboard (issue #36): one table in the run summary.
  # ---------------------------------------------------------------------------
  quality-dashboard:
    runs-on: ubuntu-latest
    needs: [flutter-quality-gate, dsp-coverage, flutter-integration]
    if: always()
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: coverage-*
          path: reports

      - name: Publish quality dashboard
        env:
          FLUTTER_RESULT: ${{ needs.flutter-quality-gate.result }}
          NATIVE_RESULT: ${{ needs.dsp-coverage.result }}
          INTEGRATION_RESULT: ${{ needs.flutter-integration.result }}
        run: |
          set +e
          # Artifact roots differ (native/build vs soundwave_app), so locate
          # the summaries instead of hard-coding nested paths.
          native=$(find reports -name summary-native.json | head -1)
          flutter=$(find reports -name summary-flutter.json | head -1)
          python3 .github/scripts/coverage_report.py dashboard \
            "${native:-summary-native.json}" "${flutter:-summary-flutter.json}"
          rc=$?
          {
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Native coverage (dsp-coverage) | $NATIVE_RESULT |"
            echo "| Flutter unit/widget tests (flutter-quality-gate) | $FLUTTER_RESULT |"
            echo "| Flutter integration tests, Linux desktop (flutter-integration) | $INTEGRATION_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$NATIVE_RESULT" != success ] || [ "$FLUTTER_RESULT" != success ] || \
             [ "$INTEGRATION_RESULT" != success ]; then
            rc=1
          fi
          exit $rc

  # ---------------------------------------------------------------------------
  # Memory safety (issue #28)
  # ---------------------------------------------------------------------------
  dsp-sanitizers:
    name: dsp-sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan]
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build

      - name: Configure (${{ matrix.sanitizer }})
        run: |
          cmake -S native -B native/build-${{ matrix.sanitizer }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DSW_ENABLE_ASAN=${{ matrix.sanitizer == 'asan' && 'ON' || 'OFF' }} \
            -DSW_ENABLE_UBSAN=${{ matrix.sanitizer == 'ubsan' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build native/build-${{ matrix.sanitizer }}

      - name: Run all tests, sanitizer canaries and fuzz smoke tests
        run: ctest --test-dir native/build-${{ matrix.sanitizer }} --output-on-failure -j "$(nproc)"

  dsp-fuzz:
    name: dsp-fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_crc, fuzz_rs, fuzz_css, fuzz_ofdm, fuzz_packet, fuzz_fec, fuzz_api]
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm cmake ninja-build
          sudo apt-get install -y libclang-rt-dev || true
          echo 'int LLVMFuzzerTestOneInput(const char*d,unsigned long n){return 0;}' > probe.c
          clang -fsanitize=fuzzer probe.c -o probe && echo "libFuzzer available"

      - name: Configure libFuzzer + ASan + UBSan build
        run: |
          cmake -S native -B native/build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DSW_BUILD_TESTS=OFF \
            -DSW_ENABLE_FUZZER=ON -DSW_ENABLE_ASAN=ON -DSW_ENABLE_UBSAN=ON

      - name: Build ${{ matrix.target }}
        run: cmake --build native/build-fuzz --target ${{ matrix.target }}

      - name: Fuzz ${{ matrix.target }} for 60 s
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/native/Fuzzing/lsan.supp
        run: |
          mkdir -p corpus artifacts
          ./native/build-fuzz/Fuzzing/${{ matrix.target }} corpus \
            -max_total_time=60 -max_len=16384 -rss_limit_mb=2048 -timeout=25 \
            -print_final_stats=1 -artifact_prefix=artifacts/

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash-${{ matrix.target }}
          path: artifacts/
          if-no-files-found: ignore

  dsp-static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install analyzers
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang clang-tidy cmake ninja-build

      - name: cppcheck
        run: |
          cppcheck --version
          cppcheck --enable=warning,portability --std=c11 --inline-suppr \
            --suppressions-list=native/.cppcheck-suppressions \
            --error-exitcode=1 --quiet \
            -I native/include native/src native/Fuzzing native/tests/test_memsafety.c

      - name: clang-tidy
        run: |
          cmake -S native -B native/build-tidy -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DSW_BUILD_TESTS=OFF
          clang-tidy --version
          find native/src -name '*.c' -print0 | \
            xargs -0 -n1 -P "$(nproc)" clang-tidy -p native/build-tidy --quiet

  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate headings
        run: |
          for file in docs/*.md README.md; do
            if [ -f "$file" ]; then
              echo "Validating: $file"
              head -1 "$file" | grep -q "^#" || echo "WARNING: $file may be missing heading"
            fi
          done

      - name: Check markdown files exist
        run: |
          find . -name "*.md" -not -path "./.git/*" -not -path "./_deps/*" | while read f; do
            echo "Found: $f"
          done
